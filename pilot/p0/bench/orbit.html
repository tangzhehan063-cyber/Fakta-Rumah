<script type="module">
import * as THREE from 'three';

const P = new URLSearchParams(location.search);
const KEY = P.get('key'), EL = 35.264, DIST = 6.0, VH = 3.2, VW = VH * 9 / 16, STEP = 4, PAD = 0.06;
const S = await (await fetch('/spec/scene_neutral.json')).json();

const nx = gw + 1 + 2 * Math.round(gw * PAD), ny = gh + 1 + 2 * Math.round(gh * PAD), ox = Math.round(gw * PAD), oy = Math.round(gh * PAD);

  const k = j * nx + i, gi = i - ox, gj = j - oy, u = gi / gw, v = gj / gh; // u,v di luar [0,1] = piksel pinggir direntangkan
  const z = zAt(Math.round(Math.min(1, Math.max(0, u)) * (W - 1)), Math.round(Math.min(1, Math.max(0, v)) * (H - 1)));
  pos[k * 3] = (u - 0.5) * VW; pos[k * 3 + 1] = (0.5 - v) * VH; pos[k * 3 + 2] = -z;

const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); g.setIndex(idx);

</script></body></html>
