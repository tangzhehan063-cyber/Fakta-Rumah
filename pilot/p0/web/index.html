<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "/node_modules/three/build/three.module.js", "three/addons/": "/node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { GTAOPass } from 'three/addons/postprocessing/GTAOPass.js';
import { BokehPass } from 'three/addons/postprocessing/BokehPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const scene3 = await (await fetch('/spec/scene.json')).json();
const W = scene3.format.width, H = scene3.format.height;
const P = new URLSearchParams(location.search);
const QUALITY = P.get('q') || 'final';          // 'draft' = tanpa AO/DOF/MSAA
const SCALE = parseFloat(P.get('scale') || '1');
const rw = Math.round(W * SCALE), rh = Math.round(H * SCALE);

const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(rw, rh);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(scene3.background);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.45;

// ---- material
const texLoader = new THREE.TextureLoader();
const texCache = {};
function tex(name) {
  if (!texCache[name]) {
    const t = texLoader.load('/assets/tex/' + name);
    t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
    texCache[name] = t;
  }
  return texCache[name];
}
const mats = {};
for (const [k, m] of Object.entries(scene3.materials)) {
  const o = { color: new THREE.Color(m.color), roughness: m.roughness, metalness: m.metallic };
  if (m.map) o.map = tex(m.map);
  if (m.opacity !== undefined) { o.transparent = true; o.opacity = m.opacity; o.depthWrite = (k === 'water'); }
  if (m.emissive) { o.emissive = new THREE.Color(m.emissive); o.emissiveIntensity = m.emissive_strength; }
  mats[k] = new THREE.MeshPhysicalMaterial(o);
}
// ---- geometri
const group = new THREE.Group(); scene.add(group);
for (const ob of scene3.objects) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(ob.positions, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(ob.normals, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(ob.uvs, 2));
  g.setIndex(ob.indices);
  const mesh = new THREE.Mesh(g, mats[ob.material]);
  const glass = scene3.materials[ob.material].opacity !== undefined;
  mesh.castShadow = !glass; mesh.receiveShadow = true;
  if (ob.material === 'water') mesh.renderOrder = 1; if (ob.material === 'glass') mesh.renderOrder = 2;
  if (ob.material === 'accent_warm') mesh.castShadow = false;
  if (ob.material === 'plate') { mesh.castShadow = false; }
  group.add(mesh);
}
// ---- cahaya
const L = scene3.lights;
const key = new THREE.DirectionalLight(new THREE.Color(L.key.color), 3.2 * L.key.strength);
key.position.set(...L.key.dir_from.map(v => v * 6)); key.target.position.set(-0.2, 0.4, -0.9);
key.castShadow = true; key.shadow.mapSize.set(4096, 4096);
const sc = key.shadow.camera; sc.left = -2.4; sc.right = 2.4; sc.top = 2.4; sc.bottom = -2.4; sc.near = 0.5; sc.far = 14;
key.shadow.radius = 7; key.shadow.blurSamples = 20; key.shadow.bias = -0.0004; key.shadow.normalBias = 0.012;
scene.add(key, key.target);
scene.add(new THREE.HemisphereLight(new THREE.Color(L.fill.sky), new THREE.Color(L.fill.ground), 1.1 * L.fill.strength));
const accent = new THREE.PointLight(new THREE.Color(L.accent.color), 2.2 * L.accent.strength, 2.2, 1.6);
accent.position.set(...L.accent.pos); scene.add(accent);

// ---- kamera (fungsi bersama dengan Blender)
const camera = new THREE.PerspectiveCamera(30, W / H, 0.05, 40);
function poseFrom(c) {
  const az = c.az * Math.PI / 180, el = c.el * Math.PI / 180;
  const t = new THREE.Vector3(...c.target);
  const pos = t.clone().add(new THREE.Vector3(Math.cos(el) * Math.sin(az), Math.sin(el), Math.cos(el) * Math.cos(az)).multiplyScalar(c.dist));
  return { pos, t };
}
const ease = { inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2 };
function lerpCam(a, b, u) {
  const l = (p, q) => p + (q - p) * u;
  return { target: a.target.map((v, i) => l(v, b.target[i])), az: l(a.az, b.az), el: l(a.el, b.el), dist: l(a.dist, b.dist), fov: l(a.fov, b.fov),
           dof: (a.dof || b.dof) ? { focus: l((a.dof||{focus:a.dist}).focus, (b.dof||{focus:b.dist}).focus), fstop: l((a.dof||{fstop:16}).fstop, (b.dof||{fstop:16}).fstop) } : null };
}
// ---- composer
const rt = new THREE.WebGLRenderTarget(rw, rh, { type: THREE.HalfFloatType, samples: QUALITY === 'draft' ? 0 : 4 });
const composer = new EffectComposer(renderer, rt);
composer.setSize(rw, rh);
const renderPass = new RenderPass(scene, camera); composer.addPass(renderPass);
const gtao = new GTAOPass(scene, camera, rw, rh);
gtao.output = GTAOPass.OUTPUT.Default;
gtao.updateGtaoMaterial({ radius: 0.28, distanceExponent: 1.2, thickness: 1.2, scale: 1.1, samples: 16, distanceFallOff: 1, screenSpaceRadius: false });
gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 16 });
composer.addPass(gtao);
const bokeh = new BokehPass(scene, camera, { focus: 2, aperture: 0.0, maxblur: 0.01 });
composer.addPass(bokeh);
composer.addPass(new OutputPass());

window.__ready = false;
window.renderCam = (c) => {
  const { pos, t } = poseFrom(c);
  camera.position.copy(pos); camera.fov = c.fov; camera.updateProjectionMatrix(); camera.lookAt(t);
  const useDof = QUALITY !== 'draft' && c.dof;
  bokeh.enabled = !!useDof;
  gtao.enabled = QUALITY !== 'draft';
  if (useDof) {
    bokeh.uniforms['focus'].value = c.dof.focus;
    bokeh.uniforms['aperture'].value = 0.0016 / c.dof.fstop * Math.min(1, 1.2 / c.dof.focus);
    bokeh.uniforms['maxblur'].value = 0.02;
  }
  composer.render();
  return true;
};
window.renderShot = (name) => window.renderCam(scene3.cameras[name]);
window.renderClip = (frame) => {
  const clip = scene3.clip; const n = Math.round(clip.seconds * scene3.format.fps);
  const u = ease[clip.ease](Math.min(1, frame / (n - 1)));
  return window.renderCam(lerpCam(scene3.cameras[clip.from], scene3.cameras[clip.to], u));
};
window.__ready = true;
</script>
</body>
</html>
